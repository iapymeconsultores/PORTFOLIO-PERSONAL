<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorobel, ordenador central (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2;--panel:#fff;--ink:#15181b;--ink2:#4b535b;--muted:#6b737a;--line:#e2e3de;--line2:#eeeeea;--soft:#faf9f7;--rail:#ecece7;
  --ac:#1a3cc8;--ac-dark:#142fa0;--ac-soft:#e8ecfb;
  --red:#b9322a;--red-soft:#fbeceb;--amber:#7a4f0c;--amber-soft:#fbf3e2;--green:#2e7a4f;--green-ink:#1e6b3e;--green-soft:#e6f2ea;
  --txt:"Schibsted Grotesk","Avenir Next","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--txt);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:650;letter-spacing:-.025em}
h2{font-size:16px;margin:0;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}.red{color:var(--red)}
.lead{font-size:18px;line-height:1.5;color:var(--ink2);max-width:62ch;margin:8px 0 0}
.lead b{color:var(--ink);font-weight:650}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:#fafaf8;border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:0 32px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mark{width:30px;height:30px;background:var(--ink);color:#fff;border-radius:3px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs a{white-space:nowrap;display:flex;align-items:center;padding:0 12px;text-decoration:none;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);font-weight:650;border-bottom-color:var(--ac)}
.me{margin-left:auto;display:flex;align-items:center;gap:12px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:3px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;flex:none}
.av.s{width:22px;height:22px;font-size:10.5px}
.wrap{max-width:1240px;margin:0 auto;padding:32px 32px 72px}
.ribbon{background:var(--amber-soft);border:1px solid #d9b56a;color:var(--amber);font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;border:1px solid var(--ink);background:#fff;padding:0 14px;border-radius:3px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac-dark)}
.btn.dk{background:var(--ink);color:#fff}
.btn.ghost{border-color:#b9bcb4;font-weight:500}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-color:#b9bcb4}
.btn.sm.pri{border-color:var(--ac)}
.btn.big{height:64px;font-size:17px;width:100%}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600;font-size:14px}
.seg{display:inline-flex;background:#e3e3dd;border-radius:4px;padding:2px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:3px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #cbcdc6}

/* paneles */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start;margin-top:28px}
.stack>*+*{margin-top:28px}
.panel{background:#fff;border:1px solid var(--line);border-radius:4px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pb{padding:16px 18px}
.empty{padding:18px;color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.callout{background:var(--amber-soft);border:1px solid #d9b56a;border-radius:4px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.callout.red{background:var(--red-soft);border-color:#e2b7b3;color:#7e1a17}

/* filas de trabajo */
.irow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.irow:last-child{border-bottom:0}
.irow .t{flex:1;min-width:0}
.kt{flex:none;width:112px}
.irow .tt{font-weight:600;font-size:15px}
.irow .mm{font-size:13px;color:var(--muted)}
.tag{flex:none;display:inline-block;font-size:12px;font-weight:650;padding:1px 7px;border-radius:2px;border:1px solid #cbcdc6;background:#f5f5f2;color:#3a4249;white-space:nowrap}
.tag.urg{background:var(--red);border-color:var(--red);color:#fff}
.tag.avi{border-color:#d9b56a;background:var(--amber-soft);color:var(--amber)}
.tag.ok{border-color:#a9cdb5;background:var(--green-soft);color:var(--green-ink)}
.tag.cur{border-color:#b7c3f0;background:var(--ac-soft);color:var(--ac)}
.due-red{color:var(--red);font-weight:650}

/* checklist */
.crow{display:flex;align-items:center;gap:16px;padding:12px 18px;min-height:64px;border:0;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:none;text-align:left;font-size:16px}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--soft)}
.cbox{width:28px;height:28px;border:2px solid var(--ink);border-radius:3px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:#fff}
.crow.done .cbox{background:var(--green);border-color:var(--green)}
.crow.done .ctext{color:var(--muted)}
.ctext{flex:1}
.cwho{font-size:13px;color:var(--muted);white-space:nowrap}
.csub{display:block;font-size:13px;color:var(--ink2);margin-top:3px}

/* inicio */
.home{max-width:1000px;margin:0 auto;padding:44px 32px 80px}
.home h1{font-size:44px;margin-top:28px}
.grp{margin-top:30px}
.grp h2{font-size:13px;color:var(--muted);font-weight:650;margin-bottom:10px}
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.who{min-height:72px;border:1px solid #b9bcb4;background:#fff;border-radius:4px;text-align:left;padding:10px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:17px;font-weight:650;line-height:1.2}
.who small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.who:hover{border-color:var(--ink);background:var(--soft)}

/* elecciones grandes */
.choices{display:grid;gap:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{min-height:50px;border:1px solid #b9bcb4;border-radius:3px;background:#fff;text-align:left;padding:10px 14px;font-weight:600;cursor:pointer;line-height:1.25}
.choice small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
.choice:hover{border-color:var(--ink)}
.choice.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.choice.on small{color:#cfd3d6}
.q{font-weight:650;margin:18px 0 8px}
.q:first-of-type{margin-top:4px}

/* tablas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.go{cursor:pointer}tr.go:hover td{background:var(--soft)}

/* tablero */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:22px}
.filters label,.field>label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
select,input[type=text],input[type=date],input[type=number],input:not([type]),textarea{border:1px solid #b9bcb4;border-radius:3px;background:#fff;padding:0 10px;height:38px}
textarea{height:auto;padding:8px 10px;width:100%}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;margin-top:20px}
.lane{background:var(--rail);border-radius:4px;padding:12px}
.lane h2{display:flex;justify-content:space-between;margin:2px 4px 12px}
.lane h2 span{font-size:13px;color:var(--muted);font-weight:600}
.card{background:#fff;border:1px solid #dcddd7;border-radius:3px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card .tt{font-weight:600;line-height:1.35;margin:6px 0 10px}
.card .ft{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.card .ft .d{margin-left:auto}

/* formularios */
.field{margin-bottom:14px}
.field input,.field select{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:end}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#modal{position:fixed;inset:0;background:rgba(21,24,27,.5);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:20}
#modal.open{display:flex}
#modal .sheet{background:#fff;border-radius:4px;padding:24px 26px;width:100%;max-width:560px;border:1px solid var(--ink)}
#modal .sheet.wide{max-width:820px}
#modal h3{font-size:22px;font-weight:650;letter-spacing:-.015em;margin:0 0 6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:3px;font-weight:600;display:none;z-index:30;max-width:90vw}
details summary{cursor:pointer;font-weight:600;list-style-position:inside}
details[open] summary{margin-bottom:10px}

/* gráficos y checklist resumido */
.chart{width:100%;height:auto;display:block}
.chart .b{fill:#aeb4b9}.chart .b.cur{fill:var(--ac)}
.chart text{font-family:var(--txt)}.chart .v{font-size:13px;font-weight:700;fill:var(--ink)}.chart .l{font-size:11px;fill:var(--muted)}
.chart .goal{stroke:var(--red);stroke-dasharray:4 3;stroke-width:1.5}.chart .gl{font-size:11px;fill:var(--red);font-weight:600}
.cells{display:inline-flex;gap:3px}
.cell{width:20px;height:14px;border-radius:2px;display:inline-block;box-sizing:border-box}
.cell.ok{background:var(--green)}
.cell.miss{background:repeating-linear-gradient(135deg,#fff 0 3px,var(--red) 3px 5px);border:1px solid var(--red)}
.cell.pend{background:#fff;border:1px dashed #9aa1a7}

/* QR */
.qrtop{background:var(--ink);color:#f4f4f1;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qrtop .btn{color:var(--ink);border-color:#fff}
.poster{background:#fff;border:10px solid var(--ink);padding:28px;max-width:440px;margin:36px auto 0}
.poster h2{font-size:44px;line-height:1;letter-spacing:-.035em;font-weight:800}
.qrbox{width:190px;height:190px;display:block;margin:22px 0 10px}
.phone{background:#fff;border:1px solid var(--line);border-radius:4px;max-width:420px;margin:28px auto 0;padding:24px 22px}
.phone h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}

@media (max-width:1000px){.cols{grid-template-columns:1fr}.kan{grid-template-columns:1fr}.topin{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}.wrap{padding:22px 16px 60px}.two,.three,.choices.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){#toast.show{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
const KEY='gorobel-demo-v2';
const IDLE_MS=3*60*1000;

/* ---------- constantes del servicio ---------- */
const AREAS=['Equipo y clases','Material','Socios nuevos','Comunidad'];
const ALL_AREAS=AREAS.concat(['Joseba','Sin decidir']);
const CENTERS=['Llodio','Amurrio'];
const SHIFTS=['Apertura','Cierre'];
const STAFF=['Joseba','Patricia','Luis','Asier','Iria'];
const FICHAS={
  'Equipo y clases':{para:'Que todas las clases tengan entrenador y mantengan el nivel.',decide:['Quién sustituye una clase','Cambios puntuales de cuadrante'],consulta:['Cambios de horario fijos','Temas de contrato o tarifa']},
  'Material':{para:'Que el material de los dos centros esté en buen estado y no falte nada.',decide:['Reparaciones y pedidos de hasta 150 € (importe por confirmar)'],consulta:['Compras por encima de 150 €','Cambio de proveedor']},
  'Socios nuevos':{para:'Que cada socio nuevo se sienta acompañado el primer mes y se quede.',decide:['Horario de la clase de prueba','A qué clases orientar al socio'],consulta:['Descuentos o condiciones especiales']},
  'Comunidad':{para:'Que los socios reciban respuesta rápida y estén informados.',decide:['Respuestas a dudas con respuesta rápida','Avisos ya aprobados'],consulta:['Quejas','Temas de pagos','Avisos de cambios de precio']}
};
const AVISO_TIPOS=[
  ['Algo roto o que no funciona','Máquinas, material, instalaciones','Material'],
  ['Limpieza, vestuarios o que falta algo','Papel, jabón, toallas','Material'],
  ['Una clase o un entrenador','Horarios, sustituciones','Equipo y clases'],
  ['Altas, pruebas o primer mes','Socios nuevos','Socios nuevos'],
  ['Avisos, grupos o WhatsApp','Mensajes del centro','Comunidad']
];
const PHRASES=[
  ['Un entrenador te escribe por una baja','Escríbele a Patricia, que lleva el cuadrante.'],
  ['Un socio te escribe al móvil personal','Te contestan antes por el WhatsApp del centro. Ya les paso tu mensaje.'],
  ['Alguien te para por algo roto','Apúntalo en el QR de la entrada, que le llega a Luis.'],
  ['Te preguntan por un socio nuevo','Eso lo lleva Asier, pregúntale a él.'],
  ['No sabes de qué área es','Lo apunto y lo vemos el lunes con Patricia.']
];
const CATS=['Eliminar','Automatizar','Delegar','Mantener'];
const CANALES=['WhatsApp','Llamada','En persona','Email','Redes'];

/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parts=s=>s.split('-').map(Number);
const addDays=(s,n)=>{const p=parts(s);return iso(new Date(p[0],p[1]-1,p[2]+n));};
const dow=s=>{const p=parts(s);return (new Date(p[0],p[1]-1,p[2]).getDay()+6)%7;};
const weekStart=s=>addDays(s,-dow(s));
const diffDays=(a,b)=>{const x=parts(a),y=parts(b);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);};
const fd=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1];};
const wl=w=>fd(w)+' al '+fd(addDays(w,6));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const DIAS=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const longDate=s=>{const p=parts(s);const d=DIAS[dow(s)];return d.charAt(0).toUpperCase()+d.slice(1)+' '+p[2]+' de '+MESES[p[1]-1];};
const ini=n=>n==='Equipo de turno'?'ET':String(n||'?').slice(0,2).toUpperCase();
const opts=(list,sel)=>list.map(v=>{const val=Array.isArray(v)?v[0]:v,lab=Array.isArray(v)?v[1]:v;return '<option value="'+esc(val)+'"'+(String(val)===String(sel)?' selected':'')+'>'+esc(lab)+'</option>';}).join('');
const fld=(label,inner)=>'<div class="field"><label>'+label+'</label>'+inner+'</div>';
const plural=(n,a,b)=>n+' '+(n===1?a:b);

/* ---------- datos de ejemplo (todo ficticio) ---------- */
function seed(){
  const t=today(),ws=weekStart(t);
  const s={v:2,center:'Llodio',nid:1,items:[],log:[],checks:{},kpi:{},actas:[],diag:false,baselineWeek:addDays(ws,-21),
    owners:{'Equipo y clases':'Patricia','Material':'Luis','Socios nuevos':'Asier','Comunidad':'Iria'},
    turno:['Haizea','Bilall','Bader','Miguel','Dennyse','Agus'],
    checkItems:{
      Apertura:['Luces, música y climatización encendidas','Ordenador central encendido con la app y WhatsApp abiertos','Revisar si hay avisos abiertos','Material de la primera clase preparado','Vestuarios y baños en orden'],
      Cierre:['Material recogido y en su sitio','Si has visto algo roto, avísalo','Mensajes del WhatsApp del centro sin responder: avisar a Iria','Ventanas, luces y climatización apagadas','Puerta y alarma']
    }};
  const id=()=>s.nid++;
  const own=a=>a==='Joseba'||a==='Sin decidir'?'Joseba':s.owners[a];
  const T=(title,area,center,status,created,due,closed,notes,owner)=>s.items.push({id:id(),kind:'tarea',title,area,owner:owner||own(area),center,status,created:addDays(t,created),due:due==null?'':addDays(t,due),closed:closed==null?'':addDays(t,closed),notes:notes||'',urg:'',by:'',src:'',cost:''});
  T('Cuadrante de la próxima semana en los dos centros','Equipo y clases','Los dos','En curso',-3,2);
  T('Revisar la clase de Barre del sábado','Equipo y clases','Amurrio','Pendiente',-1,5);
  T('Cubrir la clase de las 19:00 del jueves','Equipo y clases','Amurrio','En curso',0,1,null,'Bader no puede. Probar con Dennyse o Agus.');
  T('Pedido de discos de 5 kg','Material','Amurrio','Pendiente',-6,-1,null,'Quedan 4 discos. Entra dentro del límite de compra de Luis.');
  T('Reponer bandas elásticas','Material','Amurrio','En curso',-1,3);
  T('Revisar la cinta de correr 3','Material','Llodio','En curso',-4,-2,null,'Pedir revisión al técnico.');
  T('Inventario mensual de material','Material','Llodio','Pendiente',-2,7);
  T('Llamar a los socios nuevos de la semana pasada','Socios nuevos','Los dos','En curso',-2,1);
  T('Confirmar las tres clases de prueba del sábado','Socios nuevos','Amurrio','Pendiente',-1,3);
  T('Actualizar el mensaje de bienvenida con los nuevos horarios','Socios nuevos','Los dos','Pendiente',-5,4);
  T('Revisar la respuesta rápida /precios tras el cambio de tarifas','Comunidad','Los dos','En curso',-2,0);
  T('Aviso del evento de noviembre en los grupos','Comunidad','Los dos','Pendiente',-1,10);
  T('Decidir si se compra a otro proveedor con descuento','Joseba','Los dos','Pendiente',-3,2);
  T('Un socio pide factura de las tres últimas cuotas','Sin decidir','Llodio','Pendiente',-1,null,null,'¿De quién es? Se decide el lunes.');
  T('Dejar a punto el vestuario antes de la clase de las 19:00','Material','Amurrio','Pendiente',0,0,null,'','Equipo de turno');
  T('Reponer toallas de papel en recepción','Material','Llodio','Pendiente',0,0,null,'','Equipo de turno');
  T('Cubrir la clase de Fight de las 20:00 por baja de Bader','Equipo y clases','Llodio','Hecha',-3,-2,-2);
  T('Avisar del cambio de horario de Barre en los grupos','Comunidad','Los dos','Hecha',-3,-1,-1);
  T('Revisión de calidad de la clase de Fight','Equipo y clases','Llodio','Hecha',-4,-1,0);
  T('Seguimiento del primer mes de un socio','Socios nuevos','Llodio','Hecha',-4,-1,-1);
  T('Pedido de cuerdas de saltar','Material','Los dos','Hecha',-9,-5,-6);
  T('Reparar el candado de una taquilla','Material','Llodio','Hecha',-8,-5,-5);
  T('Clase de prueba de dos personas','Socios nuevos','Amurrio','Hecha',-7,-6,-6);
  T('Mensaje de bienvenida a las altas de la semana','Socios nuevos','Los dos','Hecha',-9,-7,-7);

function bars(vals,labels,goal){
  const W=360,H=170,max=Math.max.apply(null,vals.concat([goal||0,1])),n=vals.length,gap=26,pl=12,bw=(W-pl*2-gap*(n-1))/n,base=H-24,top=22;

  vals.forEach((v,i)=>{const h=(base-top)*v/max,x=pl+i*(bw+gap),y=base-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="2" class="b'+(i===n-1?' cur':'')+'"/><text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" class="v">'+v+'</text><text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" class="l">'+esc(labels[i])+'</text>';});
  if(goal){const y=base-(base-top)*goal/max;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" class="goal"/><text x="'+(W-2)+'" y="'+(y-6)+'" text-anchor="end" class="gl">Objetivo '+goal+'</text>';}
  return s+'</svg>';
}
function fakeQR(){

  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9))continue;if(((x*7+y*13+x*y*3)%5)<2)r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#15181b"/>';}
  fin(0,0);fin(N-7,0);fin(0,N-7);

}

/* ---------- interrupciones de Joseba ---------- */
function vInterr(){
  const ws=weekStart(today()),bw=S.baselineWeek;
  const per=[['esta','Esta semana ('+wl(ws)+')'],['pasada','Semana pasada ('+wl(addDays(ws,-7))+')'],['inicio','Semana de diagnóstico ('+wl(bw)+')'],['todas','Todo']];
  let E=S.log.slice();
  if(U.logWeek==='esta')E=E.filter(e=>e.date>=ws);else if(U.logWeek==='pasada')E=E.filter(e=>e.date>=addDays(ws,-7)&&e.date<ws);else if(U.logWeek==='inicio')E=E.filter(e=>e.date>=bw&&e.date<addDays(bw,7));
  E.sort((a,b)=>(a.date+a.hora)<(b.date+b.hora)?1:-1);
  const red=E.filter(e=>e.did==='Redirigido').length,base=weekStats(bw).interr;
  const sum=(title,key,vals)=>{const rows=vals.map(v=>[v,E.filter(e=>e[key]===v).length]).filter(x=>x[1]);if(!rows.length)return '';const mx=Math.max.apply(null,rows.map(x=>x[1]));return '<div style="margin-bottom:16px"><div class="small muted" style="font-weight:650;margin-bottom:6px">'+title+'</div>'+rows.map(x=>'<div class="row" style="flex-wrap:nowrap;margin-bottom:4px"><span style="width:150px">'+esc(x[0])+'</span><span style="flex:1;height:8px;background:#e6e7e2"><i style="display:block;height:100%;width:'+Math.round(x[1]/mx*100)+'%;background:var(--ink)"></i></span><b style="width:28px;text-align:right">'+x[1]+'</b></div>').join('')+'</div>';};
  return '<div class="wrap"><h1>Mis interrupciones</h1>'+
    '<p class="lead">'+(E.length?'<b>'+plural(E.length,'interrupción','interrupciones')+'</b> en este periodo: '+red+' redirigidas y '+(E.length-red)+' resueltas por ti. ':'Sin interrupciones en este periodo. ')+'El objetivo es bajar de '+Math.round(base/2)+' por semana.</p>'+
    '<div class="filters"><div><label for="lw">Periodo</label><select id="lw" data-f="logWeek">'+opts(per,U.logWeek)+'</select></div></div>'+
    '<div class="cols"><div class="tw"><table><thead><tr><th>Día</th><th>Área</th><th>Qué hiciste</th><th>Qué era</th></tr></thead><tbody>'+
    (E.map(e=>'<tr><td style="white-space:nowrap">'+fd(e.date)+' <span class="muted small">'+esc(e.hora)+'</span></td><td>'+esc(e.area)+'</td><td>'+(e.did==='Redirigido'?'<span class="tag ok">Redirigido</span>':'<span class="tag avi">Lo resolví yo</span>')+'</td><td>'+(e.que?esc(e.que):'<span class="muted">Sin descripción</span>')+(e.cat?' <span class="muted small">('+esc(e.cat)+')</span>':'')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">Nada apuntado.</td></tr>')+'</tbody></table></div>'+
    '<aside class="stack"><section class="panel"><div class="ph"><h2>Frases para redirigir</h2></div><div class="pb">'+PHRASES.map(p=>'<p style="margin:0 0 10px"><span class="small muted" style="font-weight:650">'+esc(p[0])+'</span><br>'+esc(p[1])+'</p>').join('')+'</div></section>'+
    '<details class="panel pb"><summary>Resumen del periodo</summary>'+sum('Por área','area',ALL_AREAS)+sum('Por lo que hiciste','did',['Redirigido','Lo resolví yo'])+sum('Por categoría (semana de diagnóstico)','cat',CATS)+sum('Por canal (semana de diagnóstico)','canal',CANALES)+'</details></aside></div></div>';
}

function vQR(){
  let body;
  if(U.qr==='cartel')body='<div class="poster"><h2>¿Algo no va bien?</h2><p style="font-size:17px;margin:14px 0 0">Escanea el código y cuéntanoslo. Un minuto, sin registrarte.</p>'+fakeQR()+'<div class="small muted">Código de demostración, no se puede escanear. Cada centro tiene el suyo.</div></div><div style="text-align:center;margin-top:20px"><button class="btn pri" data-act="qr-scan">Simular que lo escaneo</button></div>';
  else if(U.qr==='form')body='<form data-form="qr" class="phone"><div class="small muted">Gorobel Kirol Gunea, '+esc(S.center)+'</div><h2 style="margin-top:4px">¿Algo no va bien?</h2>'+avisoForm(true)+'<button class="btn pri big" style="margin-top:22px">Enviar aviso</button></form>';
  else{const r=U.lastQR||{};body='<div class="phone"><h2>Gracias'+(r.by?', '+esc(r.by):'')+'</h2><p>Le llega a <b>'+esc(r.owner||'')+'</b>, que se encarga.'+(r.urg?' Como es peligroso o impide entrenar, lo ve como urgente.':'')+'</p><button class="btn" data-act="qr-scan">Enviar otro aviso</button></div>';}
  return '<div class="qrtop"><b>Vista del socio</b><span class="row"><span class="small" style="color:#cfd3d6">Así lo ve quien escanea el QR, sin entrar en la app</span><button class="btn sm" data-act="qr-exit">Volver a la app</button></span></div><div style="padding:0 16px 60px">'+body+'</div>';
}

/* ---------- modales ---------- */
function openAviso(){
  U.draft={};
  modal('<form data-form="aviso"><h3>Avisar de algo</h3><p class="muted" style="margin:0 0 6px">Le llega al responsable del área.</p>'+avisoForm(false)+'<div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Enviar aviso</button></div></form>');
}
function openNewTask(){
  modal('<form data-form="newtask"><h3>Nueva tarea</h3>'+fld('Qué hay que hacer','<input name="title" required>')+'<div class="two">'+fld('Quién','<select name="owner">'+opts(STAFF.concat(['Equipo de turno']),U.user==='Joseba'?'Patricia':U.user)+'</select>')+fld('Para cuándo <span style="font-weight:400">(opcional)</span>','<input type="date" name="due">')+'</div>'+
    '<div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Crear</button></div></form>');
  setTimeout(()=>{const i=$('#modal input[name=title]');if(i)i.focus();},30);
}
function openItem(id){
  const it=S.items.find(x=>x.id===+id);if(!it)return;
  const isA=it.kind==='aviso';
  modal('<form data-form="item" data-id="'+it.id+'"><h3>'+(isA?'Aviso':'Tarea')+'</h3><p class="muted small" style="margin:0 0 14px">'+(isA?(it.src==='QR'?'Entró por el QR':'Lo avisó '+esc(it.by))+' el '+fd(it.created)+'.':'Creada el '+fd(it.created)+'.')+'</p>'+
    fld('Qué es','<input name="title" required value="'+esc(it.title)+'">')+
    '<div class="two">'+(isA?fld('Área','<select name="area">'+opts(ALL_AREAS.map(a=>[a,a==='Joseba'||a==='Sin decidir'?a:a+' ('+S.owners[a]+')']),it.area)+'</select>'):fld('Quién','<select name="owner">'+opts(STAFF.concat(['Equipo de turno']),it.owner)+'</select>'))+
    fld('Estado','<select name="status">'+opts(['Pendiente','En curso','Hecha'],it.status)+'</select>')+'</div>'+
    '<div class="two">'+fld('Centro','<select name="center">'+opts(CENTERS.concat(['Los dos']),it.center)+'</select>')+(isA?fld('Urgencia','<select name="urg">'+opts([['Alta','Urgente'],['Normal','Normal']],it.urg)+'</select>'):fld('Para cuándo','<input type="date" name="due" value="'+esc(it.due)+'">'))+'</div>'+
    (isA?fld('Coste en euros <span style="font-weight:400">(opcional)</span>','<input type="number" min="0" step="0.01" name="cost" value="'+esc(it.cost)+'">'):'')+
    fld('Notas','<textarea name="notes" rows="2">'+esc(it.notes)+'</textarea>')+
    '<div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Guardar</button></div></form>');
}
function openInterr(){
  U.draft={};
  const areas=AREAS.map(a=>[a,a,'Lo lleva '+S.owners[a]]).concat([['Joseba','Era mío','Solo lo puedo hacer yo'],['Sin decidir','No sé de quién es','Se decide el lunes']]);
  const d=U.draft;
  modal('<form data-form="interr"><h3>Me han interrumpido</h3><p class="muted" style="margin:0 0 4px">Dos toques y guardar.</p>'+
    '<div class="q">¿De qué era?</div><div class="choices two" id="ia">'+areas.map(x=>'<button type="button" class="choice" data-act="pick" data-k="area" data-v="'+esc(x[0])+'">'+esc(x[1])+'<small>'+esc(x[2])+'</small></button>').join('')+'</div>'+
    '<div id="idid"></div>'+
    '<details style="margin-top:16px"'+(S.diag?' open':'')+'><summary class="small">Detalles '+(S.diag?'(semana de diagnóstico)':'opcionales')+'</summary>'+fld('Qué era','<input name="que">')+
    (S.diag?'<div class="three">'+fld('Minutos','<input type="number" min="0" name="min">')+fld('Canal','<select name="canal">'+opts(CANALES)+'</select>')+fld('Categoría','<select name="cat">'+opts(CATS)+'</select>')+'</div>':'')+'</details>'+
    '<div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn pri">Guardar</button></div></form>');
}
function renderInterrDid(){
  const d=U.draft,box=$('#idid');if(!box)return;
  if(!d.area||d.area==='Joseba'||d.area==='Sin decidir'){box.innerHTML=d.area==='Sin decidir'?'<p class="small muted" style="margin:12px 0 0">Se apunta y aparece en la revisión del lunes para decidir de quién es.</p>':'';return;}
  const o=S.owners[d.area];
  box.innerHTML='<div class="q">¿Qué hiciste?</div><div class="choices two"><button type="button" class="choice'+(d.did==='Redirigido'?' on':'')+'" data-act="pick" data-k="did" data-v="Redirigido">Se lo pasé a '+esc(o)+'<small>Lo correcto</small></button><button type="button" class="choice'+(d.did==='Lo resolví yo'?' on':'')+'" data-act="pick" data-k="did" data-v="Lo resolví yo">Lo resolví yo<small>Se comenta el lunes</small></button></div>';
}
function openChk14(){
  const t=today(),days=[];for(let o=0;o>=-13;o--)days.push(addDays(t,o));
  const cells=(c,d,sh)=>{const o=getChk(c,d,sh);return '<span class="cells">'+S.checkItems[sh].map(x=>'<span class="cell '+(o[x]?'ok':(d===t?'pend':'miss'))+'" title="'+esc(x)+(o[x]?': '+esc(o[x].by)+', '+esc(o[x].at):'')+'"></span>').join('')+'</span>';};
  const who=(c,d)=>{const s=new Set();SHIFTS.forEach(sh=>Object.values(getChk(c,d,sh)).forEach(v=>s.add(v.by)));return Array.from(s).join(', ');};
  modal('<h3>Checklist de los últimos 14 días</h3><p class="muted small" style="margin:0 0 12px">Cada cuadro es un punto. Rayado: no se marcó.</p>'+CENTERS.map(c=>'<h2 style="margin:16px 0 8px">'+c+' <span class="small muted" style="font-weight:400">'+chk7(c)+'% en 7 días</span></h2><div class="tw"><table><thead><tr><th>Día</th><th>Apertura</th><th>Cierre</th><th>Marcaron</th></tr></thead><tbody>'+
    days.map(d=>'<tr><td style="white-space:nowrap">'+DIAS[dow(d)].slice(0,3)+' '+fd(d)+'</td><td>'+cells(c,d,'Apertura')+'</td><td>'+cells(c,d,'Cierre')+'</td><td class="small muted">'+esc(who(c,d))+'</td></tr>').join('')+'</tbody></table></div>').join('')+
    '<div class="actions"><button class="btn" data-act="close">Cerrar</button></div>',true);
}

/* ---------- maqueta y rutas ---------- */
function clearHash(){U.route=null;}
const ROUTES={joseba:['panel','todas','interrupciones','revision'],patricia:['mio','todas','revision','ajustes'],resp:['mio','todas'],turno:['turno']};
function render(keep){
  const y=window.scrollY,app=$('#app'),h=U.route||'';
  if(h==='qr'){app.innerHTML=vQR();window.scrollTo(0,keep?y:0);return;}
  if(!U.user){app.innerHTML=vHome();window.scrollTo(0,keep?y:0);return;}
  const r=role(U.user),allowed=ROUTES[r],route=allowed.indexOf(h)>=0?h:allowed[0];
  const V={panel:vPanel,todas:()=>vTodas(r),interrupciones:vInterr,revision:vRevision,ajustes:vAjustes,mio:vMio,turno:vTurno}[route];
  app.innerHTML=topbar(r,route)+V();
  window.scrollTo(0,keep?y:0);
}
function go(route){U.route=route;render();}
function logout(msg){U.user=null;U.shift=null;U.showCheck=false;closeModal();clearHash();render();if(msg)toast(msg);}

/* ---------- acciones ---------- */
function setStatus(it,st){it.status=st;it.closed=st==='Hecha'?today():'';save();}
function addAviso(f,src){
  const d=U.draft,tp=AVISO_TIPOS[d.tipo],area=tp[2],foto=f.get('foto');
  const by=src==='QR'?((f.get('by')||'').trim()||'Un socio'):U.user;
  S.items.push({id:S.nid++,kind:'aviso',title:f.get('frase').trim(),area,owner:'',center:S.center,status:'Pendiente',created:today(),due:'',closed:'',notes:(foto&&foto.size)?'Foto adjunta: '+foto.name:'',urg:d.urg?'Alta':'Normal',by,src,cost:''});
  save();return {owner:ownerOfArea(area),urg:!!d.urg,by:src==='QR'?(f.get('by')||'').trim():''};
}
document.addEventListener('click',e=>{
  U.lastAct=Date.now();
  if(e.target.id==='modal'){closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A')e.preventDefault();
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'login':U.user=d.u;U.shift=null;U.showCheck=false;clearHash();render();break;
    case 'logout':logout();break;
    case 'go':go(d.r);break;
    case 'shift':U.shift=d.s;render(true);break;
    case 'togglecheck':U.showCheck=!U.showCheck;render(true);break;
    case 'check':{
      const k=d.c+'|'+today()+'|'+d.s,txt=S.checkItems[d.s][+d.i],o=Object.assign({},getChk(d.c,today(),d.s)),v=o[txt];
      if(v&&v.by!==U.user){toast('Lo marcó '+v.by+'. Solo lo puede desmarcar quien lo marcó.');break;}
      if(v)delete o[txt];else o[txt]={by:U.user,at:nowHM()};
      S.checks[k]=o;save();render(true);
      if(!v&&chkCount(d.c,today(),d.s)===S.checkItems[d.s].length)toast(d.s+' completa. Gracias, '+U.user+'.');
      break;}
    case 'set':{const it=S.items.find(x=>x.id===+d.id);setStatus(it,d.st);render(true);if(d.st==='Hecha')toast(it.kind==='aviso'?'Aviso resuelto. Si tuvo coste, añádelo en Más.':'Tarea hecha');break;}
    case 'item':openItem(d.id);break;
    case 'newtask':openNewTask();break;
    case 'aviso':openAviso();break;
    case 'interr':openInterr();break;
    case 'chk14':openChk14();break;
    case 'pick':{
      const v=d.k==='tipo'?+d.v:(d.k==='urg'?d.v==='1':d.v);U.draft[d.k]=v;
      el.parentNode.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',b===el));
      if(d.k==='area'){delete U.draft.did;renderInterrDid();}
      break;}
    case 'area':U.f={area:d.a,center:'Todos',kind:'Todo'};go('todas');break;
    case 'close':closeModal();break;
    case 'set-center':S.center=d.c;save();render(true);toast('Este ordenador queda en '+d.c);break;
    case 'chk-del':S.checkItems[d.s].splice(+d.i,1);save();render(true);break;
    case 'turno-del':S.turno.splice(+d.i,1);save();render(true);break;
    case 'diag':S.diag=d.v==='1';save();render(true);break;
    case 'qr-open':U.qr='cartel';go('qr');break;
    case 'qr-scan':U.qr='form';U.draft={};render();break;
    case 'qr-exit':U.qr='cartel';clearHash();render();break;
    case 'reset':if(confirm('Se borrarán los cambios y volverán los datos de ejemplo. ¿Seguro?')){try{localStorage.removeItem(KEY);}catch(x){}S=seed();save();logout('Datos de la demo reiniciados');}break;
  }
});
document.addEventListener('change',e=>{
  U.lastAct=Date.now();
  const el=e.target;
  if(el.dataset.f){if(el.dataset.f==='logWeek')U.logWeek=el.value;else U.f[el.dataset.f]=el.value;render(true);return;}
  if(el.dataset.owner){S.owners[el.dataset.owner]=el.value;save();render(true);toast(el.dataset.owner+': ahora lo lleva '+el.value);return;}
  if(el.dataset.assign){const it=S.items.find(x=>x.id===+el.dataset.assign),a=el.value;if(!a)return;it.area=a;if(it.kind==='tarea')it.owner=ownerOfArea(a);save();render(true);toast('Asignado a '+ownerOfArea(a));return;}
  if(el.name==='frase'||el.name==='by')U.draft[el.name]=el.value;
});
document.addEventListener('input',e=>{U.lastAct=Date.now();const el=e.target;if(el.name==='frase'||el.name==='by')U.draft[el.name]=el.value;});
document.addEventListener('submit',e=>{
  e.preventDefault();U.lastAct=Date.now();
  const form=e.target,kind=form.dataset.form,f=new FormData(form);
  if(kind==='aviso'||kind==='qr'){
    if(U.draft.tipo===undefined){toast('Elige qué pasa');return;}
    if(U.draft.urg===undefined){toast('Dinos si es peligroso o impide entrenar');return;}
    const r=addAviso(f,kind==='qr'?'QR':'Equipo');
    if(kind==='qr'){U.lastQR=r;U.qr='done';render();}
    else{closeModal();render(true);toast(r.urg?'Le llega ahora a '+r.owner+' como urgente':'Le llega a '+r.owner);}
  }else if(kind==='quick'){
    const ow=f.get('owner');
    S.items.push({id:S.nid++,kind:'tarea',title:f.get('title').trim(),area:areaOf(ow)||(ow==='Joseba'?'Joseba':'Material'),owner:ow,center:'Los dos',status:'Pendiente',created:today(),due:f.get('due')||'',closed:'',notes:'',urg:'',by:U.user,src:'',cost:''});
    save();render(true);toast(ow===U.user?'Añadida a lo tuyo':'Tarea creada para '+ow);setTimeout(()=>{const i=$('#qt');if(i)i.focus();},30);
  }else if(kind==='newtask'){
    const ow=f.get('owner');
    S.items.push({id:S.nid++,kind:'tarea',title:f.get('title').trim(),area:areaOf(ow)||(ow==='Joseba'?'Joseba':'Material'),owner:ow,center:'Los dos',status:'Pendiente',created:today(),due:f.get('due')||'',closed:'',notes:'',urg:'',by:U.user,src:'',cost:''});
    save();closeModal();render(true);toast('Tarea creada para '+ow);
  }else if(kind==='item'){
    const it=S.items.find(x=>x.id===+form.dataset.id),was=it.status;
    it.title=f.get('title').trim();it.center=f.get('center');it.notes=(f.get('notes')||'').trim();
    if(it.kind==='aviso'){it.area=f.get('area');it.urg=f.get('urg');it.cost=f.get('cost')||'';}
    else{it.owner=f.get('owner');it.area=areaOf(it.owner)||it.area;it.due=f.get('due')||'';}
    const st=f.get('status');if(st!==was)setStatus(it,st);
    save();closeModal();render(true);toast('Guardado');
  }else if(kind==='interr'){
    const dd=U.draft;
    if(!dd.area){toast('Elige de qué era');return;}
    const own=dd.area==='Joseba'||dd.area==='Sin decidir';
    if(!own&&!dd.did){toast('Elige qué hiciste');return;}
    const que=(f.get('que')||'').trim();
    S.log.push({id:S.nid++,date:today(),hora:nowHM(),que,area:dd.area,did:own?'Lo resolví yo':dd.did,canal:f.get('canal')||'',cat:f.get('cat')||'',min:f.get('min')||''});
    if(dd.area==='Sin decidir')S.items.push({id:S.nid++,kind:'tarea',title:que||'Interrupción sin dueño ('+fd(today())+')',area:'Sin decidir',owner:'Joseba',center:'Los dos',status:'Pendiente',created:today(),due:'',closed:'',notes:'',urg:'',by:'Joseba',src:'',cost:''});
    save();closeModal();render(true);toast(dd.did==='Redirigido'?'Apuntado. Bien redirigido.':'Apuntado');
  }else if(kind==='acta'){
    const ws=weekStart(today());S.kpi[ws]=S.kpi[ws]||{};
    ['resp','horas'].forEach(k=>{const v=f.get(k);if(v!=='')S.kpi[ws][k]=Number(v);});
    S.actas.push({id:S.nid++,date:today(),vencidas:f.get('vencidas').trim(),urgentes:f.get('urgentes').trim(),redir:f.get('redir').trim(),ajuste:f.get('ajuste').trim(),resp:f.get('aresp')});
    save();render();toast('Acta guardada');
  }else if(kind==='chk-add'){
    const sh=form.dataset.s,t=f.get('t').trim();if(t&&S.checkItems[sh].indexOf(t)<0)S.checkItems[sh].push(t);save();render(true);
  }else if(kind==='turno-add'){
    const n=f.get('n').trim();if(n&&S.turno.indexOf(n)<0&&STAFF.indexOf(n)<0)S.turno.push(n);save();render(true);
  }
});
document.addEventListener('keydown',e=>{U.lastAct=Date.now();if(e.key==='Escape')closeModal();});
setInterval(()=>{if(U.user&&Date.now()-U.lastAct>IDLE_MS)logout('Sesión cerrada por inactividad');},10000);
clearHash();
render();
})();
</script>
</body>
</html>
